<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>싱글 버블파이터</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="game-container">

    <header class="game-header">
        <div>
            <h1>🫧 싱글 버블파이터</h1>
            <p class="rule">30초 동안 최대한 많은 적을 처치하세요.</p>
        </div>

        <div class="game-info">
            <div>
                <span>점수</span>
                <strong id="score">0</strong>
            </div>

            <div>
                <span>처치</span>
                <strong id="kills">0</strong>
            </div>

            <div>
                <span>시간</span>
                <strong id="timer">30</strong>
            </div>

            <div>
                <span>HP</span>
                <strong id="hp">100</strong>
            </div>
        </div>
    </header>

    <section class="game-area">

        <canvas
            id="gameCanvas"
            width="1280"
            height="720">
        </canvas>

        <div id="pauseOverlay" class="overlay hidden">
            <div class="overlay-box">
                <h2>일시정지</h2>
                <p>ESC 또는 버튼을 눌러 계속합니다.</p>
                <button id="resumeButton">계속하기</button>
            </div>
        </div>

        <div id="gameOver" class="overlay hidden">
            <div class="overlay-box">
                <h2 id="resultTitle">게임 종료</h2>

                <p>
                    처치한 적
                    <strong id="finalKills">0</strong>
                </p>

                <p>
                    점수
                    <strong id="finalScore">0</strong>
                </p>

                <p>
                    최고 기록
                    <strong id="bestScore">0</strong>
                </p>

                <button id="restartButton">다시 시작</button>
            </div>
        </div>

    </section>

    <div class="bottom-bar">

        <p class="controls">
            WASD / 방향키 이동 · 마우스 조준 · 클릭 / Space 발사 · ESC 일시정지
        </p>

        <div class="settings">
            <label>
                <input type="checkbox" id="muteToggle">
                효과음 끄기
            </label>
        </div>

    </div>

</main>

<script src="game.js"></script>

</body>
</html>
